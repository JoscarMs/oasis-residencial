<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="l1_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="l1_navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="l1_fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="l1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ISOTIPO IZQUIERDA -->
  <g transform="translate(20, 10)">
    <!-- Círculo base de comunidad (mesa redonda / unión) -->
    <circle cx="70" cy="70" r="64" fill="none" stroke="url(#l1_gold)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.6" />
    
    <!-- Alas / Hojas de Palmera & Pilares de Residencia que abrazan -->
    <path d="M 32,88 C 28,50 50,22 70,16 C 62,36 64,68 70,88 Z" fill="url(#l1_navy)" />
    <path d="M 108,88 C 112,50 90,22 70,16 C 78,36 76,68 70,88 Z" fill="url(#l1_navy)" />

    <!-- Bloques arquitectónicos (Torre / Hogar) -->
    <rect x="48" y="58" width="16" height="42" rx="3" fill="#1E293B" opacity="0.9" />
    <rect x="76" y="58" width="16" height="42" rx="3" fill="#1E293B" opacity="0.9" />
    
    <!-- Ventanas doradas que evocan luces encendidas de noche de viernes -->
    <rect x="52" y="65" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="58" y="65" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="52" y="74" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="58" y="74" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="80" y="65" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="86" y="65" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="80" y="74" width="3.5" height="4.5" rx="1" fill="#FDE047" />
    <rect x="86" y="74" width="3.5" height="4.5" rx="1" fill="#FDE047" />

    <!-- La Fogata / Llama Central (Noches de Juegos, Campamentos y Cocina) -->
    <path d="M 70,98 C 60,94 54,82 62,68 C 66,74 68,64 70,52 C 72,64 74,74 78,68 C 86,82 80,94 70,98 Z" fill="url(#l1_fire)" filter="url(#l1_glow)" />

    <!-- Llama interna suave -->
    <path d="M 70,95 C 65,92 62,84 66,75 C 68,79 70,72 70,66 C 70,72 72,79 74,75 C 78,84 75,92 70,95 Z" fill="#FFFBEB" />

    <!-- 3 Estrellas de comunidad en la cúspide (Estudiantes, Egresados, Amistad) -->
    <circle cx="50" cy="30" r="2.2" fill="#F59E0B" />
    <circle cx="70" cy="18" r="3" fill="#F59E0B" />
    <circle cx="90" cy="30" r="2.2" fill="#F59E0B" />

    <!-- Base / Umbral de entrada -->
    <path d="M 28,104 C 50,100 90,100 112,104" stroke="url(#l1_gold)" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA DERECHA -->
  <g transform="translate(175, 42)">
    <!-- OASIS -->
    <text x="0" y="32" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="4" fill="#0F172A">
      OASIS
    </text>
    <!-- HEREDITAS -->
    <text x="140" y="32" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="400" letter-spacing="4" fill="#D97706">
      HEREDITAS
    </text>

    <!-- Línea divisoria elegante con rombo central -->
    <line x1="0" y1="46" x2="135" y2="46" stroke="#D97706" stroke-width="1.2" opacity="0.8" />
    <polygon points="145,46 148,43 151,46 148,49" fill="#D97706" />
    <line x1="160" y1="46" x2="295" y2="46" stroke="#D97706" stroke-width="1.2" opacity="0.8" />

    <!-- SUBTÍTULO CONCEPTO -->
    <text x="0" y="66" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.8" fill="#475569">
      RESIDENCIA UNIVERSITARIA • COMUNIDAD
    </text>

    <!-- BADGE O ETIQUETA INFERIOR -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="200" height="18" rx="9" fill="#FEF3C7" />
      <text x="10" y="12" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1" fill="#92400E">
        ESTUDIANTES &amp; EGRESADOS • JULIACA
      </text>
    </g>
  </g>
</svg>
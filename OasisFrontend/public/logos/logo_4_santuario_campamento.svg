<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="l4_circle_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="l4_gold_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="l4_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ISOTIPO CIRCULAR: SANTUARIO, CAMPAMENTO & OASIS -->
  <g transform="translate(25, 12)" filter="url(#l4_shadow)">
    <!-- Medallón principal -->
    <circle cx="68" cy="68" r="62" fill="url(#l4_circle_bg)" stroke="url(#l4_gold_leaf)" stroke-width="2.5" />

    <!-- Estrellas del Altiplano de Juliaca en el cielo nocturno -->
    <circle cx="40" cy="30" r="1.5" fill="#FEF08A" opacity="0.9" />
    <circle cx="58" cy="22" r="1.2" fill="#FEF08A" opacity="0.7" />
    <circle cx="82" cy="24" r="1.8" fill="#FEF08A" opacity="0.9" />
    <circle cx="96" cy="35" r="1.2" fill="#FEF08A" opacity="0.8" />
    <circle cx="48" cy="46" r="1.4" fill="#FEF08A" opacity="0.6" />

    <!-- Luna creciente dorada -->
    <path d="M 88,26 A 10 10 0 0 0 76,40 A 10 10 0 0 1 88,26 Z" fill="#FDE047" />

    <!-- Tejado / Carpa de Campamento / Edificio en A-Frame (Hogar protector) -->
    <polygon points="68,36 102,96 34,96" fill="#134E4A" stroke="#2DD4BF" stroke-width="1.5" />
    <!-- Línea divisoria de fachada y luz interior de fogata/habitación -->
    <polygon points="68,36 68,96 34,96" fill="#042F2E" />
    <!-- Puerta iluminada en forma de llama/cálida acogida -->
    <polygon points="68,64 78,96 58,96" fill="#F59E0B" />
    <polygon points="68,72 74,96 62,96" fill="#FEF3C7" />

    <!-- Palmera estilizada que abraza el lado izquierdo (Oasis de descanso) -->
    <path d="M 28,102 Q 38,72 52,60 C 44,68 38,82 36,102 Z" fill="url(#l4_gold_leaf)" />
    <path d="M 22,78 Q 38,62 50,60 C 38,68 30,76 22,78 Z" fill="url(#l4_gold_leaf)" />

    <!-- Montañas andinas en la base (Puno / Juliaca) -->
    <polygon points="18,108 42,94 66,108" fill="#064E3B" opacity="0.6" />
    <polygon points="56,108 82,90 114,108" fill="#042F2E" opacity="0.8" />

    <!-- Base de madera / Fogata de los viernes -->
    <ellipse cx="68" cy="116" rx="34" ry="4" fill="#D97706" opacity="0.4" />
    <line x1="48" y1="114" x2="88" y2="114" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA DERECHA -->
  <g transform="translate(180, 42)">
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="3.5" fill="#064E3B">
      OASIS
    </text>
    <text x="135" y="32" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="400" letter-spacing="3.5" fill="#D97706">
      HEREDITAS
    </text>

    <!-- Línea con ramita o brote de hoja natural -->
    <g transform="translate(0, 44)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#059669" stroke-width="1.5" opacity="0.5" />
      <circle cx="140" cy="0" r="3" fill="#D97706" />
    </g>

    <!-- SUBTÍTULO -->
    <text x="0" y="66" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2.2" fill="#1F2937">
      SANTUARIO HABITACIONAL &amp; CAMPUS DE VIDA
    </text>
    <text x="0" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="1.2" fill="#4B5563">
      NATURALEZA, FOGATAS DE VIERNES, COCINA GRUPAL &amp; ESTUDIO
    </text>

    <!-- Badges de identidad -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#059669">
        ⛺ ESPÍRITU COMUNITARIO  •  🌲 DESCANSO TOTAL  •  🎓 PROFESIONALES &amp; ALUMNOS
      </text>
    </g>
  </g>
</svg>